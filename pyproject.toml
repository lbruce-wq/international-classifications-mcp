[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "international-classifications-mcp"
version = "0.5.1"
description = "Deterministic, provenance-first MCP for international statistical classifications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Impact Engines" }]
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.7,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
classifications-mcp = "international_classifications_mcp.server:main"
build-classification-registry = "international_classifications_mcp.build_registry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/international_classifications_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
